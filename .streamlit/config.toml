[server]
headless = true
enableCORS = false
address = "0.0.0.0"
port = 8501

[browser]
gatherUsageStats = false

# Without this block Streamlit renders its LIGHT theme and the app paints a dark
# gradient over it, so built-in widgets (notably the chat input bar) stay white and
# body text keeps a slate colour meant for white backgrounds. Values match the CSS
# custom properties in app/ui/app.py.
[theme]
base = "dark"
primaryColor = "#a78bfa"
backgroundColor = "#0b1020"
secondaryBackgroundColor = "#111827"
textColor = "#f1f5f9"
